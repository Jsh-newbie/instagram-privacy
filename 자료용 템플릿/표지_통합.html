<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>prof.Z — 표지 (통합판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Gowun+Dodum&family=Gothic+A1:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Nanum+Gothic:wght@400;700;800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1B3B36;
    --gold:#C2964A;
    --gold-soft:#d8b576;

    /* tweakable font stacks */
    --tag-font: 'Inter', sans-serif;
    --tag-size: 18pt;
    --tag-weight: 500;
    --tag-tracking: 0.32em;

    --title-font: 'Noto Serif KR', serif;
    --title-size: 56pt;
    --title-weight: 700;

    --subtitle-font: 'IBM Plex Sans KR', sans-serif;
    --subtitle-size: 22pt;
    --subtitle-weight: 500;
  }

  @page{ size: A4; margin: 0; }
  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background:#3a3a3a;
    font-family: 'Noto Serif KR', serif;
    color: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page{
    width: 210mm;
    height: 297mm;
    margin: 24px auto;
    background: var(--green);
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    padding: 26mm 24mm;
    display: flex;
    flex-direction: column;
  }

  /* ===== Background layers (toggled via [data-bg]) ===== */
  .bg{
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .page > *:not(.bg):not(.frame){ position: relative; z-index: 1; }

  /* frame sits above bg layers but below content interactions */
  .frame{ z-index: 2; }

  /* vignette */
  .page[data-bg~="vignette"] .bg-vignette{
    background: radial-gradient(ellipse at center,
      transparent 30%,
      rgba(0,0,0,calc(.18 * var(--vignette-strength, 2.2))) 75%,
      rgba(0,0,0,calc(.35 * var(--vignette-strength, 2.2))) 100%);
  }
  /* diagonal hairlines */
  .page[data-bg~="hairline"] .bg-hairline{
    background-image: repeating-linear-gradient(
      18deg,
      rgba(194,150,74,.07) 0,
      rgba(194,150,74,.07) 0.6px,
      transparent 0.6px,
      transparent 7mm);
  }
  /* topographic curves (svg) */
  .page[data-bg~="topo"] .bg-topo{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'><g fill='none' stroke='%23C2964A' stroke-width='0.6' opacity='0.10'><path d='M-50 120 Q 150 60 320 140 T 700 110'/><path d='M-50 200 Q 180 130 340 220 T 700 200'/><path d='M-50 290 Q 200 210 360 300 T 700 290'/><path d='M-50 380 Q 220 290 380 380 T 700 380'/><path d='M-50 470 Q 240 380 400 470 T 700 470'/><path d='M-50 560 Q 260 470 420 560 T 700 560'/><path d='M-50 650 Q 280 560 440 650 T 700 650'/><path d='M-50 740 Q 300 650 460 740 T 700 740'/></g></svg>");
    background-size: cover;
    background-position: center;
  }
  /* dot grid */
  .page[data-bg~="dots"] .bg-dots{
    background-image: radial-gradient(rgba(194,150,74,.16) 0.6px, transparent 1px);
    background-size: 6mm 6mm;
  }
  /* gold glow corner */
  .page[data-bg~="glow"] .bg-glow{
    background: radial-gradient(circle at 90% 10%,
      rgba(194,150,74,.20) 0%,
      rgba(194,150,74,.08) 25%,
      transparent 55%);
  }
  /* paper noise */
  .page[data-bg~="noise"] .bg-noise{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.68  0 0 0 0 0.34  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size: 200px 200px;
    opacity: var(--noise-opacity, 0.150);
  }

  .frame{
    position: absolute;
    inset: 14mm;
    border: 0.6px solid rgba(194,150,74,.55);
    pointer-events: none;
  }
  .frame .corner{ position: absolute; width: 14mm; height: 14mm; }
  .frame .corner::before,
  .frame .corner::after{ content:""; position:absolute; background: var(--gold); }
  .frame .corner::before{ height: 1.6px; width: 14mm; }
  .frame .corner::after{ width: 1.6px; height: 14mm; }
  .frame .corner.tl{ top:0; left:0; }
  .frame .corner.tl::before{ top:0; left:0; }
  .frame .corner.tl::after{ top:0; left:0; }
  .frame .corner.tr{ top:0; right:0; }
  .frame .corner.tr::before{ top:0; right:0; }
  .frame .corner.tr::after{ top:0; right:0; }
  .frame .corner.bl{ bottom:0; left:0; }
  .frame .corner.bl::before{ bottom:0; left:0; }
  .frame .corner.bl::after{ bottom:0; left:0; }
  .frame .corner.br{ bottom:0; right:0; }
  .frame .corner.br::before{ bottom:0; right:0; }
  .frame .corner.br::after{ bottom:0; right:0; }

  @media print{
    html, body{ background:#fff; }
    .page{ margin:0; box-shadow:none; }
    .tweaks{ display:none !important; }
  }

  .head{ display:flex; justify-content: space-between; align-items:center; }
  .tag{
    font-family: var(--tag-font);
    font-size: var(--tag-size);
    font-weight: var(--tag-weight);
    letter-spacing: var(--tag-tracking);
    text-transform: uppercase;
    color: var(--gold-soft);
  }
  .tag span{ color: rgba(216,181,118,.45); margin: 0 8px; }

  .hero{
    margin-top: auto;
    margin-bottom: auto;
    padding: 8mm 0;
  }
  .series-en{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 21pt;
    color: var(--gold);
    margin-bottom: 16px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .title{
    font-family: var(--title-font);
    font-weight: var(--title-weight);
    font-size: var(--title-size);
    line-height: 1.18;
    color: #fff;
    letter-spacing: -0.025em;
    display: inline-block;
    white-space: nowrap;
  }
  .title-wrap{ display: inline-block; }
  .rule{
    width: 100%;
    height: 1px;
    background: var(--gold);
    margin: 10mm 0 10mm;
  }
  .subtitle{
    font-family: var(--subtitle-font);
    font-weight: var(--subtitle-weight);
    font-size: var(--subtitle-size);
    color: rgba(255,255,255,.92);
    letter-spacing: -0.01em;
  }

  .foot{ display:flex; justify-content: space-between; align-items: flex-end; }

  /* logo placeholder */
  .logo-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width: 56mm;
    height: 18mm;
    border: 1px dashed rgba(216,181,118,.65);
    border-radius: 2mm;
    color: rgba(216,181,118,.85);
    font-family: 'Inter', sans-serif;
    font-size: 9.5pt;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: rgba(194,150,74,.05);
  }
  .logo-placeholder small{
    display:block;
    font-size: 7pt;
    letter-spacing: 0.22em;
    color: rgba(216,181,118,.55);
    margin-top: 4px;
    text-align:center;
  }
  .logo-placeholder .stack{ text-align:center; line-height:1.3; }

  .sns{
    font-family: 'Inter', sans-serif;
    font-size: 9.5pt;
    color: var(--gold);
    letter-spacing: 0.06em;
    font-weight: 500;
  }


  .logo-wrap {
    display: flex;
    align-items: center;
    height: 12mm;
  }
  .logo-img {
    height: 12mm;
    width: auto;
    display: block;
  }
  /* ===== Tweaks panel ===== */
  .tweaks{
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 280px;
    background: #1f1f1f;
    color: #eee;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px 14px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    max-height: 90vh;
    overflow-y: auto;
  }
  .tweaks.hidden{ display:none; }
  .tweaks h3{
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c2964a;
    margin-bottom: 10px;
    font-weight: 600;
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  .tweaks h3 button{
    background: transparent;
    border: 1px solid #444;
    color: #aaa;
    width: 22px; height: 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .tweaks .group{ margin-bottom: 12px; }
  .tweaks label{
    display:block;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 5px;
  }
  .tweaks select{
    width: 100%;
    padding: 6px 8px;
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #3a3a3a;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .tweaks .toggle{
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: #1B3B36;
    color: #C2964A;
    border: 1px solid #C2964A;
    padding: 8px 12px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  @media print{
    .tweaks, .tweaks-toggle{ display:none !important; }
  }
</style>
</head>

      <option value="gothic-a1-black">Gothic A1 Black</option>
      <option value="ibm">IBM Plex Sans KR Bold</option>
      <option value="playfair">Playfair + Noto Serif</option>
      <option value="dm-serif">DM Serif + Noto Serif</option>
    </select>
  </div>

  <div class="group">
    <label>부제목 폰트 (중등 기본 용어 통합판)</label>
    <select id="subtitleFont">
      <option value="ibm" selected>IBM Plex Sans KR</option>
      <option value="gothic-a1">Gothic A1</option>
      <option value="nanum-gothic">Nanum Gothic</option>
      <option value="noto-serif">Noto Serif KR</option>
      <option value="nanum-myeongjo">Nanum Myeongjo</option>
      <option value="gowun-batang">Gowun Batang</option>
      <option value="gowun-dodum">Gowun Dodum</option>
    </select>
  </div>
</div>

<script>
  const FONTS = {
    'inter':           { f: "'Inter', sans-serif",                w: 500, t: '0.32em' },
    'ibm':             { f: "'IBM Plex Sans KR', sans-serif",     w: 600, t: '0.18em' },
    'gothic-a1':       { f: "'Gothic A1', sans-serif",            w: 700, t: '0.18em' },
    'gothic-a1-black': { f: "'Gothic A1', sans-serif",            w: 900, t: '-0.02em' },
    'nanum-gothic':    { f: "'Nanum Gothic', sans-serif",         w: 800, t: '0.16em' },
    'black-han':       { f: "'Black Han Sans', sans-serif",       w: 400, t: '0.04em' },
    'cormorant':       { f: "'Cormorant Garamond', serif",        w: 500, t: '0.12em', i: true },
    'noto-serif':      { f: "'Noto Serif KR', serif",             w: 700, t: '-0.02em' },
    'nanum-myeongjo':  { f: "'Nanum Myeongjo', serif",            w: 800, t: '-0.02em' },
    'gowun-batang':    { f: "'Gowun Batang', serif",              w: 700, t: '-0.02em' },
    'gowun-dodum':     { f: "'Gowun Dodum', sans-serif",          w: 400, t: '-0.01em' },
    'playfair':        { f: "'Playfair Display','Noto Serif KR',serif", w: 700, t: '-0.02em' },
    'dm-serif':        { f: "'DM Serif Display','Noto Serif KR',serif", w: 400, t: '-0.02em' },
  };

  const root = document.documentElement.style;

  function applyTag(key){
    const o = FONTS[key]; if(!o) return;
    root.setProperty('--tag-font', o.f);
    root.setProperty('--tag-weight', o.w);
    root.setProperty('--tag-tracking', o.t);
    // italic via font-style on .tag
    document.querySelector('.tag').style.fontStyle = o.i ? 'italic' : 'normal';
    // text-transform: keep uppercase except for korean-leading serifs (still ok)
  }
  function applyTitle(key){
    const o = FONTS[key]; if(!o) return;
    root.setProperty('--title-font', o.f);
    root.setProperty('--title-weight', o.w);
  }
  function applySubtitle(key){
    const o = FONTS[key]; if(!o) return;
    root.setProperty('--subtitle-font', o.f);
    root.setProperty('--subtitle-weight', o.w);
  }

  const bgSel = null;
  const pageEl = document.getElementById('page');

  const tagSel = document.getElementById('tagFont');
  const titleSel = document.getElementById('titleFont');
  const subSel = document.getElementById('subtitleFont');

  tagSel.addEventListener('change', e => applyTag(e.target.value));
  titleSel.addEventListener('change', e => applyTitle(e.target.value));
  subSel.addEventListener('change', e => applySubtitle(e.target.value));

  // toggle panel
  const panel = document.getElementById('tweaksPanel');
  const toggle = document.getElementById('tweaksToggle');
  const closeBtn = document.getElementById('tweaksClose');

  function showPanel(){
    panel.classList.remove('hidden');
    toggle.style.display = 'none';
  }
  function hidePanel(){
    panel.classList.add('hidden');
    toggle.style.display = '';
  }
  toggle.addEventListener('click', showPanel);
  closeBtn.addEventListener('click', hidePanel);

  // host integration (optional)
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode') showPanel();
    if (d.type === '__deactivate_edit_mode') hidePanel();
  });
  try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(_){}
</script>

</body>
</html>
